<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    /* Product Card Section Styles - Easy to Integrate */
    .product-section {
        padding: 60px 20px;
        max-width: 1200px;
        margin: 0 auto;
        font-family: 'Segoe UI', system-ui, sans-serif;
    }
    
    .product-section-header {
        text-align: center;
        margin-bottom: 50px;
    }
    
    .product-section-title {
        font-size: 2.5rem;
        color: #1a1a1a;
        margin-bottom: 15px;
    }
    
    .product-section-subtitle {
        font-size: 1.1rem;
        color: #666;
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.6;
    }
    
    .product-cards-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 30px;
        margin-top: 30px;
    }
    
    /* Individual Product Card */
    .product-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    
    .product-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
    }
    
    .product-image-container {
        position: relative;
        height: 220px;
        overflow: hidden;
    }
    
    .product-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    
    .product-card:hover .product-image {
        transform: scale(1.05);
    }
    
    .product-badge {
        position: absolute;
        top: 15px;
        right: 15px;
        background: #3b82f6;
        color: white;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
    }
    
    .product-badge.sale {
        background: #ef4444;
    }
    
    .product-badge.new {
        background: #10b981;
    }
    
    .product-content {
        padding: 25px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }
    
    .product-category {
        color: #3b82f6;
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
    }
    
    .product-title {
        font-size: 1.4rem;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 12px;
        line-height: 1.3;
    }
    
    .product-description {
        color: #666;
        line-height: 1.5;
        margin-bottom: 20px;
        flex-grow: 1;
    }
    
    .product-rating {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
    }
    
    .product-stars {
        color: #fbbf24;
        margin-right: 8px;
    }
    
    .product-rating-count {
        color: #6b7280;
        font-size: 0.9rem;
    }
    
    .product-price-container {
        display: flex;
        align-items: center;
        margin-bottom: 25px;
    }
    
    .product-price {
        font-size: 1.8rem;
        font-weight: 700;
        color: #1a1a1a;
    }
    
    .product-price-old {
        font-size: 1.2rem;
        color: #9ca3af;
        text-decoration: line-through;
        margin-left: 10px;
    }
    
    .product-actions {
        display: flex;
        gap: 12px;
    }
    
    .product-btn {
        flex: 1;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .product-btn-primary {
        background: #3b82f6;
        color: white;
    }
    
    .product-btn-primary:hover {
        background: #2563eb;
    }
    
    .product-btn-secondary {
        background: #f3f4f6;
        color: #4b5563;
    }
    
    .product-btn-secondary:hover {
        background: #e5e7eb;
    }
    
    /* Responsive Design */
    @media (max-width: 768px) {
        .product-cards-container {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .product-section-title {
            font-size: 2rem;
        }
        
        .product-actions {
            flex-direction: column;
        }
    }
    
    @media (max-width: 480px) {
        .product-cards-container {
            grid-template-columns: 1fr;
        }
        
        .product-section {
            padding: 40px 15px;
        }
    }
</style>

<section class="product-section" id="product-cards">
    <div class="product-section-header">
        <h2 class="product-section-title">Featured Products</h2>
        <p class="product-section-subtitle">Discover our premium selection of products designed to enhance your lifestyle with quality and style.</p>
    </div>
    
    <div class="product-cards-container">
        <!-- Product Card 1 -->
         <script>
            async function LoadJson() {
                try {
                    const response = await fetch('Products.json');
                    const data = await response.json();
                    console.log(data);
                    displayProducts(data.products);
                } catch (error) {
                    console.error('Error loading JSON:', error);
                }
                
            }
            LoadJson();
            function displayProducts(products) {
                const container = document.querySelector('.product-cards-container');
                products.forEach(product => {
                    const productCard = document.createElement('div');
                    productCard.classList.add('product-card');
                    productCard.innerHTML = `
                        <div class="product-image-container">
                            <img src="${product.image}" alt="${product.name}" class="product-image">
                            <span class="product-badge ${product.badgeType}">${product.category}</span>
                        </div>
                        <div class="product-content">
                            <div class="product-category">${product.category}</div>
                            <h3 class="product-title">${product.name}</h3>
                            <p class="product-description">${product.description}</p>
                            
                            <div class="product-rating">
                                <div class="product-stars">
                                    ${'★'.repeat(Math.floor(product.rating))}${product.rating % 1 ? '½' : ''}
                                </div>
                                <span class="product-rating-count">(${product.reviewCount} reviews)</span>
                            </div>
                            
                            <div class="product-price-container">
                                <span class="product-price">$${product.price}</span>
                                ${product.oldPrice ? `<span class="product-price-old">$${product.oldPrice}</span>` : ''}
                            </div>
                            
                            <div class="product-actions">
                                <button class="product-btn product-btn-primary">
                                    <i class="fas fa-shopping-cart"></i> Add to Cart
                                </button>
                                <button class="product-btn product-btn-secondary">
                                    <i class="fas fa-heart"></i> Wishlist
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(productCard);
                });
            }
         </script>
